name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northend
          POSTGRES_PASSWORD: northend
          POSTGRES_DB: northend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northend -d northend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://northend:northend@localhost:5432/northend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API + dev deps
        run: pip install -e "apps/api[dev]"

      - name: Apply migrations (validates the full chain applies cleanly)
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run pytest
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
