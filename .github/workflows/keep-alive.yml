name: Keep API awake

# Render's free web service plan spins the container down after 15
# minutes idle, and the next request pays a 30-60s cold-start penalty
# (measured ~22s in practice) - see architecture-audit.md. Pinging
# /health every 10 minutes keeps it under that idle window so real
# visitors don't eat the cold start. This is a workaround, not a fix:
# it stops helping if Actions is disabled or a run is skipped/delayed,
# and does nothing for the free Postgres instance's separate Sept 23
# 2026 expiry (that needs a paid plan, a decision for the account owner).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://north-end-food-api.onrender.com/health")
          echo "health check returned $status"
          if [ "$status" != "200" ]; then
            echo "::warning::API health check returned $status instead of 200"
          fi
