databases:
  - name: north-end-food-db
    plan: basic-256mb
    databaseName: northend
    user: northend

services:
  - type: web
    name: north-end-food-api
    runtime: docker
    plan: starter
    rootDir: apps/api
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: north-end-food-db
          property: connectionString
      - key: API_HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://north-end-food.vercel.app
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PLACE_PHOTOS_ENABLED
        value: true
      - key: GOOGLE_PLACE_PHOTO_MONTHLY_CAP
        value: 900
      - key: SERPAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
